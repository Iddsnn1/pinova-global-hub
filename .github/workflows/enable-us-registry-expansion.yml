name: Enable U.S. Education Registry Expansion

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  enable:
    if: contains(github.event.head_commit.message, 'trigger NCES registry expansion')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable expansion job
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/expand-us-education-registry.yml')
          s = p.read_text()
          old = "if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[expand-us-registry]')"
          new = "if: github.event_name == 'workflow_dispatch' || true"
          if old not in s:
              raise SystemExit('Expansion workflow condition not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/expand-us-education-registry.yml
          git commit -m "chore(education): enable NCES expansion workflow"
          git push origin main
