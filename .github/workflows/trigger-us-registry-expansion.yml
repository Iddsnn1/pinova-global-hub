name: Trigger U.S. Education Registry Expansion

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: contains(github.event.head_commit.message, 'trigger NCES registry expansion')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch expansion workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run expand-us-education-registry.yml --ref main
