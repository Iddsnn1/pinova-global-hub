name: Currency Engine Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/utils/currencyToPi.ts"
      - "src/server/services/TrustedFx*.ts"
      - "src/server/services/TrustedFiatToPiService.ts"
      - "src/server/services/UtilityCheckoutOrchestrator.ts"
      - "src/server/services/UtilityPaymentAuthorizationService.ts"
      - "src/server/db/repositories/NeonUtilityInvoiceRepository.ts"
      - "server.ts"
      - "tests/utility_checkout_route_integration_suite.ts"
      - "tests/utility_checkout_orchestrator_suite.ts"
      - "tests/utility_payment_authorization_suite.ts"
      - "src/modules/pricing/**"
      - "src/modules/marketplace/**"
      - "src/modules/flight/**"
      - "src/modules/utility/**"
      - "src/modules/education/**"
      - "src/components/utility/**"
      - "src/context/LanguageContext.tsx"
      - "tests/currency_to_pi_conversion_suite.ts"
      - "tests/neon_utility_invoice_repository_suite.ts"
      - "package.json"
      - ".github/workflows/currency-conversion.yml"
  push:
    branches: [feat/global-currency-pi-engine]
    paths:
      - "src/utils/currencyToPi.ts"
      - "src/server/services/TrustedFx*.ts"
      - "src/server/services/TrustedFiatToPiService.ts"
      - "src/server/services/UtilityCheckoutOrchestrator.ts"
      - "src/server/services/UtilityPaymentAuthorizationService.ts"
      - "src/server/db/repositories/NeonUtilityInvoiceRepository.ts"
      - "server.ts"
      - "tests/utility_checkout_route_integration_suite.ts"
      - "tests/utility_checkout_orchestrator_suite.ts"
      - "tests/utility_payment_authorization_suite.ts"
      - "src/modules/pricing/**"
      - "src/modules/marketplace/**"
      - "src/modules/flight/**"
      - "src/modules/utility/**"
      - "src/modules/education/**"
      - "src/components/utility/**"
      - "src/context/LanguageContext.tsx"
      - "tests/currency_to_pi_conversion_suite.ts"
      - "tests/neon_utility_invoice_repository_suite.ts"
      - "package.json"
      - ".github/workflows/currency-conversion.yml"

permissions:
  contents: read

concurrency:
  group: currency-engine-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test currency conversion and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Currency conversion tests
        run: npm run test:currency
      - name: Utility checkout HTTP route tests
        run: npm run test:utility-routes
      - name: Utility checkout orchestration tests
        run: npx tsx tests/utility_checkout_orchestrator_suite.ts
      - name: Utility payment authorization tests
        run: npx tsx tests/utility_payment_authorization_suite.ts
      - name: TypeScript check
        run: npm run lint
