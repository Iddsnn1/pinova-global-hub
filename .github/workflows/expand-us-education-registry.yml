name: Expand U.S. Education Registry

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add NCES IPEDS adapter
        shell: python
        run: |
          from pathlib import Path
          service = Path('src/server/services/NcesIpedsInstitutionRegistry.ts')
          service.parent.mkdir(parents=True, exist_ok=True)
          service.write_text(r'''import type { InstitutionProfile } from '../../types/education';

const ENDPOINT = 'https://nces.ed.gov/arcgis/rest/services/IPEDS/IPEDS/MapServer/0/query';
const STATES = new Set('AL AK AZ AR CA CO CT DE FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY DC'.split(' '));
type Row = { UnitID?: number; INSTNM?: string; ADDR?: string; CITY?: string; STABBR?: string; WEBADDR?: string; CONTROL?: number; ICLEVEL?: number };
type Filter = { countryCode?: string; state?: string; institutionType?: string; isPublic?: boolean; search?: string };
let cache: { at: number; data: InstitutionProfile[] } | null = null;

function mapType(level?: number): InstitutionProfile['institutionType'] {
  return level === 1 ? 'university' : level === 2 ? 'college' : 'vocational_institute';
}
function mapRow(r: Row): InstitutionProfile | null {
  const id = Number(r.UnitID || 0), name = String(r.INSTNM || '').trim(), state = String(r.STABBR || '').toUpperCase();
  if (!id || !name || !STATES.has(state)) return null;
  const now = new Date().toISOString(), website = String(r.WEBADDR || '').trim();
  return {
    id: `inst-us-ipeds-${id}`, name, legalName: name, tradingName: name, institutionCode: `IPEDS-${id}`,
    institutionType: mapType(r.ICLEVEL), supportedTiers: ['tertiary'], country: 'United States', countryCode: 'US',
    state, city: String(r.CITY || '').trim(), address: String(r.ADDR || '').trim(), contactEmail: '', contactPhone: '',
    website: website ? (website.startsWith('http') ? website : `https://${website}`) : `https://nces.ed.gov/collegenavigator/?id=${id}`,
    logoUrl: '', isPublic: Number(r.CONTROL) === 1,
    curriculum: ['U.S. postsecondary education — NCES IPEDS directory record'], instructionLanguage: ['English'],
    isBoarding: false, hasDayOption: true,
    accreditation: { authority: 'U.S. Department of Education — NCES IPEDS', registrationNumber: String(id), accreditationStatus: 'under_review', verifiedAt: now, officialNotes: 'Institution identity is verified against the NCES IPEDS directory. Academic hierarchy and accreditation are not inferred.' },
    verificationStatus: 'VERIFIED_WITH_LIMITATIONS', verificationDate: now, acceptedCurrencies: ['USD'], supportsPiPayment: false,
    supportsInstallments: false, activeSessions: [], faculties: [], hierarchyVerificationStatus: 'PARTIALLY_VERIFIED',
    overviewDescription: 'NCES IPEDS directory record. Faculties, departments, programmes and accreditation require separate official verification.'
  };
}
async function load(): Promise<InstitutionProfile[]> {
  if (cache && cache.at > Date.now()) return cache.data;
  const rows: Row[] = [];
  for (let offset = 0; offset < 10000; offset += 1000) {
    const q = new URLSearchParams({ where: '1=1', outFields: 'UnitID,INSTNM,ADDR,CITY,STABBR,WEBADDR,CONTROL,ICLEVEL', returnGeometry: 'false', resultRecordCount: '1000', resultOffset: String(offset), orderByFields: 'INSTNM ASC', f: 'json' });
    const controller = new AbortController(); const timer = setTimeout(() => controller.abort(), 12000);
    try {
      const res = await fetch(`${ENDPOINT}?${q}`, { headers: { Accept: 'application/json' }, signal: controller.signal });
      if (!res.ok) throw new Error(`NCES HTTP ${res.status}`);
      const body = await res.json() as { features?: Array<{ attributes?: Row }>; exceededTransferLimit?: boolean };
      const page = (body.features || []).map(x => x.attributes || {}); rows.push(...page);
      if (page.length < 1000 && !body.exceededTransferLimit) break;
      if (!page.length) break;
    } finally { clearTimeout(timer); }
  }
  const data = Array.from(new Map(rows.map(mapRow).filter((x): x is InstitutionProfile => Boolean(x)).map(x => [x.id, x])).values());
  cache = { at: Date.now() + 15 * 60 * 1000, data }; return data;
}
export async function getNcesIpedsInstitutions(filter: Filter = {}): Promise<InstitutionProfile[]> {
  if (filter.countryCode && filter.countryCode.toUpperCase() !== 'US') return [];
  try {
    let data = await load(); const state = filter.state?.toUpperCase(); const search = filter.search?.toLowerCase().trim();
    if (state && state !== 'ALL') data = data.filter(x => x.state === state);
    if (filter.institutionType && filter.institutionType !== 'all') data = data.filter(x => x.institutionType === filter.institutionType);
    if (filter.isPublic !== undefined) data = data.filter(x => x.isPublic === filter.isPublic);
    if (search) data = data.filter(x => `${x.name} ${x.city} ${x.state}`.toLowerCase().includes(search));
    return data;
  } catch (error) { console.warn('[NCES IPEDS] unavailable:', error); return []; }
}
''', encoding='utf-8')

          server = Path('server.ts'); s = server.read_text(encoding='utf-8')
          imp = "import { getNcesIpedsInstitutions } from './src/server/services/NcesIpedsInstitutionRegistry';"
          if imp not in s:
              marker = "import { EducationRepository } from './src/server/db/repositories/EducationRepository';"
              s = s.replace(marker, marker + '\n' + imp, 1)
          start_marker = "app.get('/api/education/institutions', (req, res) => {"
          end_marker = "app.get('/api/education/institutions/:id'"
          a, b = s.find(start_marker), s.find(end_marker)
          if a < 0 or b < 0 or b <= a: raise SystemExit('Education route not found')
          route = r'''app.get('/api/education/institutions', async (req, res) => {
  try {
    const { countryCode, state, tier, institutionType, isPublic, search, verificationStatus } = req.query;
    const filter: any = {};
    if (countryCode) filter.countryCode = String(countryCode);
    if (state) filter.state = String(state);
    if (tier) filter.tier = String(tier);
    if (institutionType) filter.institutionType = String(institutionType);
    if (isPublic !== undefined) filter.isPublic = String(isPublic) === 'true';
    if (search) filter.search = String(search);
    if (verificationStatus) filter.verificationStatus = String(verificationStatus);
    const local = educationRepo.getInstitutions(filter);
    const remote = await getNcesIpedsInstitutions(filter);
    const merged = new Map<string, any>();
    for (const x of local) merged.set(x.id, x);
    for (const x of remote) if (!merged.has(x.id)) merged.set(x.id, x);
    const list = Array.from(merged.values());
    res.json({ success: true, count: list.length, institutions: list, source: String(countryCode || '').toUpperCase() === 'US' ? 'local+NCES_IPEDS' : 'local' });
  } catch (err: any) {
    res.status(500).json({ success: false, error: 'EDUCATION_INSTITUTIONS_FAILED', message: err.message });
  }
});

'''
          server.write_text(s[:a] + route + s[b:], encoding='utf-8')

          test = Path('tests/nces_ipeds_registry_contract_test.ts')
          test.write_text(r'''import assert from 'node:assert/strict';
import { getNcesIpedsInstitutions } from '../src/server/services/NcesIpedsInstitutionRegistry';
async function main() {
  const rows = await getNcesIpedsInstitutions({ countryCode: 'US', institutionType: 'university' });
  assert.ok(rows.length > 1, `Expected >1 U.S. universities, got ${rows.length}`);
  assert.equal(new Set(rows.map(x => x.id)).size, rows.length);
  assert.ok(rows.every(x => x.countryCode === 'US'));
  assert.ok(rows.every(x => x.verificationStatus === 'VERIFIED_WITH_LIMITATIONS'));
  console.log(`NCES IPEDS U.S. university coverage: ${rows.length}`);
}
main().catch(e => { console.error(e); process.exit(1); });
''', encoding='utf-8')

          workflow = Path('.github/workflows/education-runtime-test.yml'); w = workflow.read_text(encoding='utf-8')
          step = "      - name: NCES IPEDS U.S. registry contract test\n        run: npx tsx tests/nces_ipeds_registry_contract_test.ts\n"
          if 'NCES IPEDS U.S. registry contract test' not in w:
              w = w.replace('      - name: Education ecosystem runtime test\n', step + '      - name: Education ecosystem runtime test\n', 1)
              workflow.write_text(w, encoding='utf-8')

      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run lint
      - name: NCES IPEDS contract test
        run: npx tsx tests/nces_ipeds_registry_contract_test.ts
      - name: Education runtime test
        run: npm run test:edu
      - name: Education directory test
        run: npm run test:edu:directory
      - name: Production build
        run: npm run build
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/services/NcesIpedsInstitutionRegistry.ts server.ts tests/nces_ipeds_registry_contract_test.ts .github/workflows/education-runtime-test.yml
          git commit -m "fix(education): expand US institution coverage via NCES IPEDS" || exit 0
          git push origin main
