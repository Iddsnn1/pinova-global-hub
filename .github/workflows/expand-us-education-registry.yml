name: Expand U.S. Education Registry
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Patch NCES IPEDS registry
        shell: python
        run: |
          from pathlib import Path
          service = Path('src/server/services/NcesIpedsInstitutionRegistry.ts')
          service.parent.mkdir(parents=True, exist_ok=True)
          service.write_text(r'''import type { InstitutionProfile } from '../../types/education';
const ENDPOINT='https://nces.ed.gov/arcgis/rest/services/IPEDS/IPEDS/MapServer/0/query';
const STATES=new Set('AL AK AZ AR CA CO CT DE FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY DC'.split(' '));
type Row={UnitID?:number;INSTNM?:string;ADDR?:string;CITY?:string;STABBR?:string;WEBADDR?:string;CONTROL?:number;ICLEVEL?:number};
type Filter={countryCode?:string;state?:string;institutionType?:string;isPublic?:boolean;search?:string};
let cache:{expires:number;data:InstitutionProfile[]}|null=null;
const typeOf=(n?:number):InstitutionProfile['institutionType']=>n===1?'university':n===2?'college':'vocational_institute';
function map(r:Row):InstitutionProfile|null{const id=Number(r.UnitID||0),name=String(r.INSTNM||'').trim(),state=String(r.STABBR||'').toUpperCase();if(!id||!name||!STATES.has(state))return null;const now=new Date().toISOString(),web=String(r.WEBADDR||'').trim();return{id:`inst-us-ipeds-${id}`,name,legalName:name,tradingName:name,institutionCode:`IPEDS-${id}`,institutionType:typeOf(r.ICLEVEL),supportedTiers:['tertiary'],country:'United States',countryCode:'US',state,city:String(r.CITY||'').trim(),address:String(r.ADDR||'').trim(),contactEmail:'',contactPhone:'',website:web?(web.startsWith('http')?web:`https://${web}`):`https://nces.ed.gov/collegenavigator/?id=${id}`,logoUrl:'',isPublic:Number(r.CONTROL)===1,curriculum:['U.S. postsecondary education — NCES IPEDS directory record'],instructionLanguage:['English'],isBoarding:false,hasDayOption:true,accreditation:{authority:'U.S. Department of Education — NCES IPEDS',registrationNumber:String(id),accreditationStatus:'under_review',verifiedAt:now,officialNotes:'Institution identity is verified against the NCES IPEDS directory. Academic hierarchy and accreditation are not inferred.'},verificationStatus:'VERIFIED_WITH_LIMITATIONS',verificationDate:now,acceptedCurrencies:['USD'],supportsPiPayment:false,supportsInstallments:false,activeSessions:[],faculties:[],hierarchyVerificationStatus:'PARTIALLY_VERIFIED',overviewDescription:'NCES IPEDS directory record. Faculties, departments, programmes and accreditation require separate official verification.'};}
async function load(){if(cache&&cache.expires>Date.now())return cache.data;const rows:Row[]=[];for(let offset=0;offset<10000;offset+=1000){const q=new URLSearchParams({where:'1=1',outFields:'UnitID,INSTNM,ADDR,CITY,STABBR,WEBADDR,CONTROL,ICLEVEL',returnGeometry:'false',resultRecordCount:'1000',resultOffset:String(offset),orderByFields:'INSTNM ASC',f:'json'});const c=new AbortController(),t=setTimeout(()=>c.abort(),12000);try{const r=await fetch(`${ENDPOINT}?${q}`,{headers:{Accept:'application/json'},signal:c.signal});if(!r.ok)throw new Error(`NCES HTTP ${r.status}`);const b=await r.json() as any;const page=(b.features||[]).map((x:any)=>x.attributes||{});rows.push(...page);if(page.length<1000&&!b.exceededTransferLimit)break;if(!page.length)break;}finally{clearTimeout(t);}}const data=Array.from(new Map(rows.map(map).filter((x):x is InstitutionProfile=>!!x).map(x=>[x.id,x])).values());cache={expires:Date.now()+900000,data};return data;}
export async function getNcesIpedsInstitutions(f:Filter={}):Promise<InstitutionProfile[]>{if(f.countryCode&&f.countryCode.toUpperCase()!=='US')return[];try{let d=await load();const s=f.state?.toUpperCase(),q=f.search?.trim().toLowerCase();if(s&&s!=='ALL')d=d.filter(x=>x.state===s);if(f.institutionType&&f.institutionType!=='all')d=d.filter(x=>x.institutionType===f.institutionType);if(f.isPublic!==undefined)d=d.filter(x=>x.isPublic===f.isPublic);if(q)d=d.filter(x=>`${x.name} ${x.city} ${x.state}`.toLowerCase().includes(q));return d;}catch(e){console.warn('[NCES IPEDS] unavailable',e);return[];}}
''',encoding='utf-8')
          p=Path('server.ts');s=p.read_text(encoding='utf-8');imp="import { getNcesIpedsInstitutions } from './src/server/services/NcesIpedsInstitutionRegistry';";marker="import { EducationRepository } from './src/server/db/repositories/EducationRepository';"
          if imp not in s:s=s.replace(marker,marker+'\n'+imp,1)
          a=s.find("app.get('/api/education/institutions', (req, res) => {");b=s.find("app.get('/api/education/institutions/:id'",a)
          if a<0 or b<0:raise SystemExit('education route not found')
          route=r'''app.get('/api/education/institutions', async (req, res) => {
  try {
    const { countryCode,state,tier,institutionType,isPublic,search,verificationStatus }=req.query;const f:any={};
    if(countryCode)f.countryCode=String(countryCode);if(state)f.state=String(state);if(tier)f.tier=String(tier);if(institutionType)f.institutionType=String(institutionType);if(isPublic!==undefined)f.isPublic=String(isPublic)==='true';if(search)f.search=String(search);if(verificationStatus)f.verificationStatus=String(verificationStatus);
    const local=educationRepo.getInstitutions(f),remote=await getNcesIpedsInstitutions(f),merged=new Map<string,any>();for(const x of local)merged.set(x.id,x);for(const x of remote)if(!merged.has(x.id))merged.set(x.id,x);const list=Array.from(merged.values());
    res.json({success:true,count:list.length,institutions:list,source:String(countryCode||'').toUpperCase()==='US'?'local+NCES_IPEDS':'local'});
  }catch(err:any){res.status(500).json({success:false,error:'EDUCATION_INSTITUTIONS_FAILED',message:err.message});}
});

'''
          p.write_text(s[:a]+route+s[b:],encoding='utf-8')
      - name: Install and verify
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/services/NcesIpedsInstitutionRegistry.ts server.ts
          git commit -m "fix(education): expand US institution coverage via NCES IPEDS" || exit 0
          git push origin main
