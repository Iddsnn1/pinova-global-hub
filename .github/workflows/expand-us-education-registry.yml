          old = text[start:end]
          new = r'''app.get('/api/education/institutions', async (req, res) => {
  try {
    const { countryCode, state, tier, institutionType, isPublic, search, verificationStatus } = req.query;
    const filter: any = {};
    if (countryCode) filter.countryCode = String(countryCode);
    if (state) filter.state = String(state);
    if (tier) filter.tier = String(tier);
    if (institutionType) filter.institutionType = String(institutionType);
    if (isPublic !== undefined) filter.isPublic = String(isPublic) === 'true';
    if (search) filter.search = String(search);
    if (verificationStatus) filter.verificationStatus = String(verificationStatus);

    const local = educationRepo.getInstitutions(filter);
    const remote = await getNcesIpedsInstitutions(filter);
    const merged = new Map<string, any>();
    for (const institution of local) merged.set(institution.id, institution);
    for (const institution of remote) {
      if (!merged.has(institution.id)) merged.set(institution.id, institution);
    }

    const list = Array.from(merged.values());
    res.json({
      success: true,
      count: list.length,
      institutions: list,
      source: String(countryCode || '').toUpperCase() === 'US' ? 'local+NCES_IPEDS' : 'local'
    });
  } catch (err: any) {
    res.status(500).json({ success: false, error: 'EDUCATION_INSTITUTIONS_FAILED', message: err.message });
  }
});

'''
          text = text[:start] + new + text[end:]
          server.write_text(text, encoding='utf-8')

          # Add a focused runtime test for the remote registry contract.
          test = Path('tests/nces_ipeds_registry_contract_test.ts')
          test.write_text(r'''import assert from 'node:assert/strict';
import { getNcesIpedsInstitutions } from '../src/server/services/NcesIpedsInstitutionRegistry';

async function main() {
  const institutions = await getNcesIpedsInstitutions({ countryCode: 'US', institutionType: 'university' });
  assert.ok(institutions.length > 1, `Expected wide U.S. university coverage, received ${institutions.length}`);
  assert.ok(institutions.every((institution) => institution.countryCode === 'US'));
  assert.equal(new Set(institutions.map((institution) => institution.id)).size, institutions.length);
  assert.ok(institutions.every((institution) => institution.verificationStatus === 'VERIFIED_WITH_LIMITATIONS'));
  assert.ok(institutions.every((institution) => institution.hierarchyVerificationStatus === 'PARTIALLY_VERIFIED'));
  console.log(`NCES IPEDS U.S. university coverage: ${institutions.length}`);
}

main().catch((error) => {
  console.error(error);
  process.exit(1);
});
