name: Expand U.S. Education Registry

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  expand-us-registry:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[expand-us-registry]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Add NCES IPEDS registry adapter and wire API
        shell: python
        run: |
          from pathlib import Path
          import re

          service = Path('src/server/services/NcesIpedsInstitutionRegistry.ts')
          service.parent.mkdir(parents=True, exist_ok=True)
          service.write_text(r'''import type { InstitutionProfile } from '../../types/education';

const IPEDS_SCHOOL_DATA_URL =
  'https://nces.ed.gov/arcgis/rest/services/IPEDS/IPEDS/MapServer/0/query';

const US_STATE_CODES = new Set([
  'AL','AK','AZ','AR','CA','CO','CT','DE','FL','GA','HI','ID','IL','IN','IA','KS','KY','LA','ME','MD',
  'MA','MI','MN','MS','MO','MT','NE','NV','NH','NJ','NM','NY','NC','ND','OH','OK','OR','PA','RI','SC',
  'SD','TN','TX','UT','VT','VA','WA','WV','WI','WY','DC'
]);

type IpedsSchool = {
  UnitID?: number;
  INSTNM?: string;
  ADDR?: string;
  CITY?: string;
  STABBR?: string;
  WEBADDR?: string;
  CONTROL?: number;
  ICLEVEL?: number;
};

type InstitutionFilter = {
  countryCode?: string;
  state?: string;
  tier?: string;
  institutionType?: string;
  isPublic?: boolean;
  search?: string;
  verificationStatus?: string;
};

let cache: { expiresAt: number; institutions: InstitutionProfile[] } | null = null;
const CACHE_TTL_MS = 15 * 60 * 1000;

function mapInstitutionType(level?: number): InstitutionProfile['institutionType'] {
  if (level === 1) return 'university';
  if (level === 2) return 'college';
  return 'vocational_institute';
}

function mapInstitution(record: IpedsSchool): InstitutionProfile | null {
  const unitId = Number(record.UnitID || 0);
  const name = String(record.INSTNM || '').trim();
  const state = String(record.STABBR || '').trim().toUpperCase();
  if (!unitId || !name || !US_STATE_CODES.has(state)) return null;

  const institutionType = mapInstitutionType(record.ICLEVEL);
  const website = String(record.WEBADDR || '').trim();
  const now = new Date().toISOString();

  return {
    id: `inst-us-ipeds-${unitId}`,
    name,
    legalName: name,
    tradingName: name,
    institutionCode: `IPEDS-${unitId}`,
    institutionType,
    supportedTiers: ['tertiary'],
    country: 'United States',
    countryCode: 'US',
    state,
    city: String(record.CITY || '').trim(),
    address: String(record.ADDR || '').trim(),
    contactEmail: '',
    contactPhone: '',
    website: website ? (website.startsWith('http') ? website : `https://${website}`) : `https://nces.ed.gov/collegenavigator/?id=${unitId}`,
    logoUrl: '',
    isPublic: Number(record.CONTROL) === 1,
    curriculum: ['U.S. postsecondary education — NCES IPEDS directory record'],
    instructionLanguage: ['English'],
    isBoarding: false,
    hasDayOption: true,
    accreditation: {
      authority: 'U.S. Department of Education — National Center for Education Statistics (NCES), IPEDS',
      registrationNumber: String(unitId),
      accreditationStatus: 'under_review',
      verifiedAt: now,
      officialNotes: 'Institution identity is source-verified against the NCES IPEDS directory. Accreditation and academic hierarchy are not inferred from the directory record.'
    },
    verificationStatus: 'VERIFIED_WITH_LIMITATIONS',
    verificationDate: now,
    acceptedCurrencies: ['USD'],
    supportsPiPayment: false,
    supportsInstallments: false,
    activeSessions: [],
    faculties: [],
    hierarchyVerificationStatus: 'PARTIALLY_VERIFIED',
    overviewDescription: 'NCES IPEDS directory record. Academic faculties, departments, programmes, fees and accreditation details require verification from the institution or relevant accrediting authority.'
  };
}

async function fetchAllUsInstitutions(): Promise<InstitutionProfile[]> {
  if (cache && cache.expiresAt > Date.now()) return cache.institutions;

  const records: IpedsSchool[] = [];
  const pageSize = 1000;
  let offset = 0;

  for (let page = 0; page < 10; page += 1) {
    const params = new URLSearchParams({
      where: '1=1',
      outFields: 'UnitID,INSTNM,ADDR,CITY,STABBR,WEBADDR,CONTROL,ICLEVEL',
      returnGeometry: 'false',
      resultRecordCount: String(pageSize),
      resultOffset: String(offset),
      orderByFields: 'INSTNM ASC',
      f: 'json'
    });

    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 12000);
    try {
      const response = await fetch(`${IPEDS_SCHOOL_DATA_URL}?${params.toString()}`, {
        headers: { Accept: 'application/json' },
        signal: controller.signal
      });
      if (!response.ok) throw new Error(`NCES IPEDS HTTP ${response.status}`);
      const payload = await response.json() as { features?: Array<{ attributes?: IpedsSchool }>; exceededTransferLimit?: boolean };
      const rows = (payload.features || []).map((feature) => feature.attributes || {});
      records.push(...rows);
      if (rows.length < pageSize && !payload.exceededTransferLimit) break;
      offset += rows.length;
      if (!rows.length) break;
    } finally {
      clearTimeout(timeout);
    }
  }

  const institutions = records
    .map(mapInstitution)
    .filter((institution): institution is InstitutionProfile => Boolean(institution));

  const deduped = Array.from(new Map(institutions.map((institution) => [institution.id, institution])).values());
  cache = { expiresAt: Date.now() + CACHE_TTL_MS, institutions: deduped };
  return deduped;
}

export async function getNcesIpedsInstitutions(filter: InstitutionFilter = {}): Promise<InstitutionProfile[]> {
  if (filter.countryCode && filter.countryCode.toUpperCase() !== 'US') return [];

  try {
    let institutions = await fetchAllUsInstitutions();
    const search = filter.search?.trim().toLowerCase();
    const state = filter.state?.trim().toUpperCase();

    if (state && state !== 'ALL') institutions = institutions.filter((institution) => institution.state.toUpperCase() === state);
    if (filter.institutionType && filter.institutionType !== 'all') institutions = institutions.filter((institution) => institution.institutionType === filter.institutionType);
    if (filter.isPublic !== undefined) institutions = institutions.filter((institution) => institution.isPublic === filter.isPublic);
    if (search) institutions = institutions.filter((institution) => `${institution.name} ${institution.city} ${institution.state}`.toLowerCase().includes(search));

    return institutions;
  } catch (error) {
    console.warn('[NCES IPEDS] Remote registry unavailable; retaining local registry:', error);
    return [];
  }
}

export function getNcesIpedsRegistryStatus() {
  return {
    provider: 'NCES IPEDS',
    sourceUrl: IPEDS_SCHOOL_DATA_URL,
    cached: Boolean(cache && cache.expiresAt > Date.now()),
    cachedInstitutionCount: cache?.institutions.length || 0,
    cacheExpiresAt: cache?.expiresAt ? new Date(cache.expiresAt).toISOString() : null
  };
}
''', encoding='utf-8')

          server = Path('server.ts')
          text = server.read_text(encoding='utf-8')
