name: Normalize Global Country Labels

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, 'normalize Nigeria as deployment hub label') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize Nigeria label
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/education/InstitutionDirectory.tsx')
          text = path.read_text()
          updated = text.replace('Primary Deployment Hub', 'Deployment Hub')
          if updated == text:
              raise SystemExit('Expected Nigeria deployment label was not found')
          path.write_text(updated)
          PY

      - name: Commit normalized label and remove helper workflow
        run: |
          rm -f .github/workflows/fix-global-country-label.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/education/InstitutionDirectory.tsx .github/workflows/fix-global-country-label.yml
          git commit -m 'fix(education): make Nigeria a deployment hub, not primary hub'
          git push
