name: PiNova CI

on:
  push:
    branches: [main, design/premium-landing-preview, migration/neon-durable-storage]
  pull_request:
    branches: [main, migration/neon-durable-storage]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run lint

      - name: Typecheck critical API route
        run: npx tsc --noEmit --target ES2022 --module ESNext --moduleResolution bundler --skipLibCheck --esModuleInterop --allowSyntheticDefaultImports --types node api/vendor/apply-durable.ts

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
