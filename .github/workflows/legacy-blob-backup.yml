name: Legacy Blob Backup

on:
  workflow_dispatch:
    inputs:
      import_to_neon:
        description: 'After export validation, idempotently import the backup into Neon'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  export:
    environment: BLOB_READ_WRITE_TOKEN
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v6
        with:
          ref: migration/neon-durable-storage

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm install

      - name: Export legacy Blob data (read-only operations)
        env:
          LEGACY_BLOB_BACKUP_FILE: /tmp/pinova-legacy-blob-backup.json
          PRIVATE_BLOB_READ_WRITE_TOKEN: ${{ secrets.PRIVATE_BLOB_READ_WRITE_TOKEN }}
          PRIVATE_BLOB_STORE_ID: ${{ secrets.PRIVATE_BLOB_STORE_ID }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          BLOB_READ_TOKEN: ${{ secrets.BLOB_READ_TOKEN }}
          BLOB_WRITE_TOKEN: ${{ secrets.BLOB_WRITE_TOKEN }}
          BLOB_STORE_ID: ${{ secrets.BLOB_STORE_ID }}
        run: |
          set -euo pipefail
          test -n "${PRIVATE_BLOB_READ_WRITE_TOKEN:-${BLOB_READ_WRITE_TOKEN:-${BLOB_READ_TOKEN:-${VERCEL_OIDC_TOKEN:-}}}}" || {
            echo "No read-capable Blob token secret is configured"
            exit 1
          }
          test -n "${PRIVATE_BLOB_STORE_ID:-${BLOB_STORE_ID:-}}" || {
            echo "No Blob store ID secret is configured"
            exit 1
          }
          npm run export:legacy-blob

      - name: Validate backup manifest
        run: |
          node -e '
          const fs=require("fs");
          const p="/tmp/pinova-legacy-blob-backup.json";
          const b=JSON.parse(fs.readFileSync(p,"utf8"));
          if (b.source?.mode !== "read-only") throw new Error("Backup is not marked read-only");
          if (!Array.isArray(b.manifest)) throw new Error("Missing manifest");
          const bad=b.manifest.filter(x=>x.status!=="exported");
          if (bad.length) throw new Error("Unreadable objects remain: "+bad.length);
          console.log(JSON.stringify({
            products:b.products.length,
            orders:b.orders.length,
            vendorApplications:b.vendorApplications.length,
            manifest:b.manifest.length
          },null,2));
          '

      - name: Import validated backup into Neon
        if: ${{ inputs.import_to_neon }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}" || {
            echo "DATABASE_URL is not configured in the BLOB_READ_WRITE_TOKEN GitHub Environment"
            exit 1
          }
          node scripts/import-neon-backup.mjs /tmp/pinova-legacy-blob-backup.json | tee /tmp/neon-import-result.json
          node -e '
          const fs=require("fs");
          const r=JSON.parse(fs.readFileSync("/tmp/neon-import-result.json","utf8"));
          if (!r.ok || r.destructiveOperations !== false) throw new Error("Neon import safety check failed");
          console.log(JSON.stringify(r,null,2));
          '
      - name: Upload backup artifact
        uses: actions/upload-artifact@v6
        with:
          name: pinova-legacy-blob-backup
          path: /tmp/pinova-legacy-blob-backup.json
          if-no-files-found: error
          retention-days: 7
