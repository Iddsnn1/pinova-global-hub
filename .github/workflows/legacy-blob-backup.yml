name: Legacy Blob Backup

on:
  workflow_dispatch:
    inputs:
      import_to_neon:
        description: 'After export validation, idempotently import the backup into Neon'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  export:
    environment: LEGACY_BLOB_BACKUP
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v6
        with:
          ref: migration/neon-durable-storage

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm install

      - name: Pull production Blob credentials from Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.Vercel_Token }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || {
            echo "VERCEL_TOKEN_MISSING: Vercel_Token is required to read the production Blob credential"
            exit 1
          }
          mkdir -p /tmp/pinova-vercel
          cd /tmp/pinova-vercel
          npx --yes vercel@latest link --yes --project pinova-global-hub --scope iddsnn1s-projects --token "$VERCEL_TOKEN"
          npx --yes vercel@latest env pull .env.production --environment production --token "$VERCEL_TOKEN"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const text = fs.readFileSync('/tmp/pinova-vercel/.env.production', 'utf8');
          const env = Object.fromEntries(text.split(/\r?\n/).filter(Boolean).map(line => {
            const i = line.indexOf('=');
            if (i < 0) return [line, ''];
            const key = line.slice(0, i).trim();
            let value = line.slice(i + 1).trim();
            if ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'"))) value = value.slice(1, -1);
            return [key, value];
          }));
          const required = ['PRIVATE_BLOB_READ_WRITE_TOKEN', 'PRIVATE_BLOB_STORE_ID'];
          for (const key of required) {
            if (!String(env[key] ?? '').trim() || env[key] === '[SENSITIVE]') throw new Error(`VERCEL_PRODUCTION_ENV_MISSING: ${key}`);
          }
          if (env.PRIVATE_BLOB_STORE_ID !== 'store_zypKOROZmcB8ihIX') {
            throw new Error(`LEGACY_BLOB_STORE_MISMATCH: expected store_zypKOROZmcB8ihIX, got ${env.PRIVATE_BLOB_STORE_ID}`);
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `PRIVATE_BLOB_READ_WRITE_TOKEN=${env.PRIVATE_BLOB_READ_WRITE_TOKEN}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `PRIVATE_BLOB_STORE_ID=${env.PRIVATE_BLOB_STORE_ID}\n`);
          NODE

      - name: Verify private legacy Blob credential
        run: |
          set -euo pipefail
          test -n "${PRIVATE_BLOB_READ_WRITE_TOKEN:-}" || {
            echo "LEGACY_BLOB_TOKEN_MISSING: production PRIVATE_BLOB_READ_WRITE_TOKEN is unavailable"
            exit 1
          }
          test "${PRIVATE_BLOB_STORE_ID:-}" = "store_zypKOROZmcB8ihIX" || {
            echo "LEGACY_BLOB_STORE_MISMATCH: expected store_zypKOROZmcB8ihIX"
            exit 1
          }
          echo "Legacy Blob credential target verified: ${PRIVATE_BLOB_STORE_ID}"
          echo "Credential source: Vercel Production environment"

      - name: Export legacy Blob data (read-only operations)
        env:
          LEGACY_BLOB_BACKUP_FILE: /tmp/pinova-legacy-blob-backup.json
        run: |
          set -euo pipefail
          test "${PRIVATE_BLOB_STORE_ID:-}" = "store_zypKOROZmcB8ihIX" || {
            echo "LEGACY_BLOB_STORE_MISMATCH: expected store_zypKOROZmcB8ihIX"
            exit 1
          }
          test -n "${PRIVATE_BLOB_READ_WRITE_TOKEN:-}" || {
            echo "LEGACY_BLOB_TOKEN_MISSING: production PRIVATE_BLOB_READ_WRITE_TOKEN is required"
            exit 1
          }
          npm run export:legacy-blob

      - name: Validate export backup before any Neon write
        env:
          LEGACY_BLOB_BACKUP_FILE: /tmp/pinova-legacy-blob-backup.json
        run: |
          set -euo pipefail
          test -s "$LEGACY_BLOB_BACKUP_FILE" || { echo "LEGACY_BLOB_BACKUP_MISSING"; exit 1; }
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = process.env.LEGACY_BLOB_BACKUP_FILE;
          const backup = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (backup.schemaVersion !== 2) throw new Error('BACKUP_SCHEMA_INVALID');
          if (!Array.isArray(backup.manifest)) throw new Error('BACKUP_MANIFEST_REQUIRED');
          const collections = ['products','orders','vendorApplications','orderFulfillment'];
          const total = collections.reduce((n,k) => n + (Array.isArray(backup[k]) ? backup[k].length : 0), 0);
          if (backup.manifest.length !== total) throw new Error('BACKUP_MANIFEST_COUNT_MISMATCH');
          for (const entry of backup.manifest) {
            if (!entry || entry.status !== 'exported' || !entry.recordId || !entry.sha256 || !entry.sourceSha256) throw new Error('BACKUP_MANIFEST_INVALID_ENTRY');
          }
          console.log(JSON.stringify({validated:true, schemaVersion:backup.schemaVersion, manifest:backup.manifest.length}, null, 2));
          NODE

      - name: Import validated backup into Neon
        if: ${{ inputs.import_to_neon == true }}
        env:
          VERCEL_TOKEN: ${{ secrets.Vercel_Token }}
          LEGACY_BLOB_BACKUP_FILE: /tmp/pinova-legacy-blob-backup.json
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo "VERCEL_TOKEN_MISSING: Vercel_Token is required only for the optional Neon import environment pull"; exit 1; }
          mkdir -p /tmp/pinova-vercel
          cd /tmp/pinova-vercel
          npx --yes vercel@latest link --yes --project pinova-global-hub --scope iddsnn1s-projects --token "$VERCEL_TOKEN"
          npx --yes vercel@latest env pull .env.legacy --environment production --token "$VERCEL_TOKEN"
          set -a
          . /tmp/pinova-vercel/.env.legacy
          set +a
          test -n "${DATABASE_URL:-}" || { echo "NEON_DATABASE_URL_MISSING: DATABASE_URL was not provided by Vercel production environment"; exit 1; }
          node "$GITHUB_WORKSPACE/scripts/import-neon-backup.mjs" "$LEGACY_BLOB_BACKUP_FILE"
