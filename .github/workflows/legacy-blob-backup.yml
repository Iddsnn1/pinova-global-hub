name: Legacy Blob Backup

on:
  workflow_dispatch:
    inputs:
      import_to_neon:
        description: 'After export validation, idempotently import the backup into Neon'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  export:
    environment: LEGACY_BLOB_BACKUP
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v6
        with:
          ref: migration/neon-durable-storage

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm install

      - name: Link Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.Vercel_Token }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || {
            echo "Vercel_Token is unavailable from the LEGACY_BLOB_BACKUP environment"
            exit 1
          }
          mkdir -p /tmp/pinova-vercel
          cd /tmp/pinova-vercel
          npx --yes vercel@latest link --yes --project pinova-global-hub --scope iddsnn1s-projects --token "$VERCEL_TOKEN"

      - name: Verify detached legacy Blob credentials
        env:
          PRIVATE_BLOB_STORE_ID: ${{ secrets.PRIVATE_BLOB_STORE_ID }}
          PRIVATE_BLOB_READ_WRITE_TOKEN: ${{ secrets.PRIVATE_BLOB_READ_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${PRIVATE_BLOB_STORE_ID:-}" || {
            echo "PRIVATE_BLOB_STORE_ID is unavailable from the LEGACY_BLOB_BACKUP environment"
            exit 1
          }
          test "${PRIVATE_BLOB_STORE_ID}" = "store_zypKOROZmcB8ihIX" || {
            echo "LEGACY_BLOB_STORE_MISMATCH: expected store_zypKOROZmcB8ihIX"
            exit 1
          }
          test -n "${PRIVATE_BLOB_READ_WRITE_TOKEN:-}" || {
            echo "PRIVATE_BLOB_READ_WRITE_TOKEN is unavailable from the LEGACY_BLOB_BACKUP environment"
            exit 1
          }
          echo "Legacy Blob target verified: ${PRIVATE_BLOB_STORE_ID}"
          echo "Credential mode: store-specific PRIVATE_BLOB_READ_WRITE_TOKEN"
          echo "Production/branding Blob OIDC is intentionally not used"

      - name: Export legacy Blob data (read-only operations)
        env:
          PRIVATE_BLOB_STORE_ID: ${{ secrets.PRIVATE_BLOB_STORE_ID }}
          PRIVATE_BLOB_READ_WRITE_TOKEN: ${{ secrets.PRIVATE_BLOB_READ_WRITE_TOKEN }}
          LEGACY_BLOB_BACKUP_FILE: /tmp/pinova-legacy-blob-backup.json
        run: |
          set -euo pipefail
          test "${PRIVATE_BLOB_STORE_ID:-}" = "store_zypKOROZmcB8ihIX" || {
            echo "LEGACY_BLOB_STORE_MISMATCH: expected store_zypKOROZmcB8ihIX"
            exit 1
          }
          test -n "${PRIVATE_BLOB_READ_WRITE_TOKEN:-}" || {
            echo "LEGACY_BLOB_CREDENTIAL_MISSING: PRIVATE_BLOB_READ_WRITE_TOKEN is required"
            exit 1
          }
          npm run export:legacy-blob


