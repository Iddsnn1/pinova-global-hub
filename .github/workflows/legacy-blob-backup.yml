name: Legacy Blob Backup

on:
  workflow_dispatch:
    inputs:
      import_to_neon:
        description: 'After export validation, idempotently import the backup into Neon'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  export:
    environment: LEGACY_BLOB_BACKUP
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v6
        with:
          ref: migration/neon-durable-storage

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm install

      - name: Link Vercel project and pull production OIDC environment
        env:
          VERCEL_TOKEN: ${{ secrets.Vercel_Token }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || {
            echo "Vercel_Token is unavailable from the LEGACY_BLOB_BACKUP environment"
            exit 1
          }
          mkdir -p /tmp/pinova-vercel
          cd /tmp/pinova-vercel
          npx --yes vercel@latest link --yes --project pinova-global-hub --scope iddsnn1s-projects --token "$VERCEL_TOKEN"
          npx --yes vercel@latest env pull .env.legacy --environment production --token "$VERCEL_TOKEN"
          chmod 600 .env.legacy

      - name: Load and verify legacy Blob OIDC credentials
        run: |
          set -euo pipefail
          set -a
          . /tmp/pinova-vercel/.env.legacy
          set +a

          test -n "${VERCEL_OIDC_TOKEN:-}" || {
            echo "LEGACY_BLOB_OIDC_MISSING: VERCEL_OIDC_TOKEN was not provided by the connected Vercel project"
            exit 1
          }
          test "${PRIVATE_BLOB_STORE_ID:-}" = "store_zypKOROZmcB8ihIX" || {
            echo "LEGACY_BLOB_STORE_MISMATCH: expected store_zypKOROZmcB8ihIX"
            exit 1
          }

          {
            echo "VERCEL_OIDC_TOKEN<<EOF"
            echo "$VERCEL_OIDC_TOKEN"
            echo "EOF"
            echo "PRIVATE_BLOB_STORE_ID=$PRIVATE_BLOB_STORE_ID"
            echo "BLOB_STORE_ID=$PRIVATE_BLOB_STORE_ID"
          } >> "$GITHUB_ENV"

          echo "Legacy Blob OIDC target verified: $PRIVATE_BLOB_STORE_ID"
          echo "Credential mode: Vercel project OIDC"
          echo "Static PRIVATE_BLOB_READ_WRITE_TOKEN is not used"

      - name: Export legacy Blob data (read-only operations)
        env:
          VERCEL_TOKEN: ${{ secrets.Vercel_Token }}
          VERCEL_OIDC_TOKEN: ${{ env.VERCEL_OIDC_TOKEN }}
          PRIVATE_BLOB_STORE_ID: ${{ env.PRIVATE_BLOB_STORE_ID }}
          LEGACY_BLOB_BACKUP_FILE: /tmp/pinova-legacy-blob-backup.json
        run: |
          set -euo pipefail
          test "${PRIVATE_BLOB_STORE_ID:-}" = "store_zypKOROZmcB8ihIX" || {
            echo "LEGACY_BLOB_STORE_MISMATCH: expected store_zypKOROZmcB8ihIX"
            exit 1
          }
          test -n "${VERCEL_OIDC_TOKEN:-}" || {
            echo "LEGACY_BLOB_OIDC_MISSING: VERCEL_OIDC_TOKEN is required"
            exit 1
          }
          npm run export:legacy-blob

      - name: Validate export backup before any Neon write
        env:
          LEGACY_BLOB_BACKUP_FILE: /tmp/pinova-legacy-blob-backup.json
        run: |
          set -euo pipefail
          test -s "$LEGACY_BLOB_BACKUP_FILE" || { echo "LEGACY_BLOB_BACKUP_MISSING"; exit 1; }
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = process.env.LEGACY_BLOB_BACKUP_FILE;
          const backup = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (backup.schemaVersion !== 2) throw new Error('BACKUP_SCHEMA_INVALID');
          if (!Array.isArray(backup.manifest)) throw new Error('BACKUP_MANIFEST_REQUIRED');
          const collections = ['products','orders','vendorApplications','orderFulfillment'];
          const total = collections.reduce((n,k) => n + (Array.isArray(backup[k]) ? backup[k].length : 0), 0);
          if (backup.manifest.length !== total) throw new Error('BACKUP_MANIFEST_COUNT_MISMATCH');
          for (const entry of backup.manifest) {
            if (!entry || entry.status !== 'exported' || !entry.recordId || !entry.sha256 || !entry.sourceSha256) throw new Error('BACKUP_MANIFEST_INVALID_ENTRY');
          }
          console.log(JSON.stringify({validated:true, schemaVersion:backup.schemaVersion, manifest:backup.manifest.length}, null, 2));
          NODE

      - name: Import validated backup into Neon
        if: ${{ inputs.import_to_neon == true }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LEGACY_BLOB_BACKUP_FILE: /tmp/pinova-legacy-blob-backup.json
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}" || { echo "NEON_DATABASE_URL_MISSING"; exit 1; }
          node scripts/import-neon-backup.mjs "$LEGACY_BLOB_BACKUP_FILE"
