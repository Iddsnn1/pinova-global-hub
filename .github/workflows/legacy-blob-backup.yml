name: Legacy Blob Backup

on:
  workflow_dispatch:
    inputs:
      import_to_neon:
        description: 'After export validation, idempotently import the backup into Neon'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  export:
    environment: LEGACY_BLOB_BACKUP
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v6
        with:
          ref: migration/neon-durable-storage

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm install

      - name: Link Vercel project and obtain OIDC token
        env:
          VERCEL_TOKEN: ${{ secrets.Vercel_Token }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || {
            echo "Vercel_Token is unavailable from the LEGACY_BLOB_BACKUP environment"
            exit 1
          }

          mkdir -p /tmp/pinova-vercel
          cd /tmp/pinova-vercel

          npx --yes vercel@latest link --yes --project pinova-global-hub --scope iddsnn1s-projects --token "$VERCEL_TOKEN"

          OIDC_ENV_FILE="/tmp/pinova-vercel/.env.local"
          test -f "$OIDC_ENV_FILE" || {
            echo "Vercel CLI did not create .env.local while linking pinova-global-hub"
            exit 1
          }

          node -e '
          const fs=require("fs");
          const p="/tmp/pinova-vercel/.env.local";
          const lines=fs.readFileSync(p,"utf8").split(/\r?\n/);
          const line=lines.find(x=>x.startsWith("VERCEL_OIDC_TOKEN="));
          if (!line) throw new Error("VERCEL_OIDC_TOKEN was not returned by Vercel project link");
          const value=line.slice("VERCEL_OIDC_TOKEN=".length).trim();
          if (!value || value === "[SENSITIVE]") throw new Error("VERCEL_OIDC_TOKEN returned empty or redacted");
          fs.writeFileSync("/tmp/vercel-oidc-token", value, { mode:0o600 });
          fs.rmSync(p, { force:true });
          '

          test -s /tmp/vercel-oidc-token || {
            echo "Vercel OIDC token file is empty"
            exit 1
          }

      - name: Export legacy Blob data (read-only operations)
        env:
          LEGACY_BLOB_BACKUP_FILE: /tmp/pinova-legacy-blob-backup.json
          PRIVATE_BLOB_STORE_ID: ${{ secrets.PRIVATE_BLOB_STORE_ID }}
        run: |
          set -euo pipefail
          test -n "${PRIVATE_BLOB_STORE_ID:-}" || {
            echo "PRIVATE_BLOB_STORE_ID is unavailable from the LEGACY_BLOB_BACKUP environment"
            exit 1
          }
          export VERCEL_OIDC_TOKEN="$(cat /tmp/vercel-oidc-token)"
          test -n "${VERCEL_OIDC_TOKEN:-}" || {
            echo "VERCEL_OIDC_TOKEN could not be initialized"
            exit 1
          }
          test "${PRIVATE_BLOB_STORE_ID}" = "store_zypKOROZmcB8ihIX" || {
            echo "Legacy Blob store ID does not match pinova-global-hub-blob"
            exit 1
          }
          npm run export:legacy-blob

      - name: Validate backup manifest
        run: |
          node -e '
          const fs=require("fs");
          const p="/tmp/pinova-legacy-blob-backup.json";
          const b=JSON.parse(fs.readFileSync(p,"utf8"));
          if (b.source?.mode !== "read-only") throw new Error("Backup is not marked read-only");
          if (!Array.isArray(b.manifest)) throw new Error("Missing manifest");
          const bad=b.manifest.filter(x=>x.status!=="exported");
          if (bad.length) throw new Error("Unreadable objects remain: "+bad.length);
          console.log(JSON.stringify({
            products:b.products.length,
            orders:b.orders.length,
            vendorApplications:b.vendorApplications.length,
            manifest:b.manifest.length
          },null,2));
          '

      - name: Import validated backup into Neon
        if: ${{ inputs.import_to_neon }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}" || {
            echo "DATABASE_URL is not configured in the LEGACY_BLOB_BACKUP GitHub Environment"
            exit 1
          }
          node scripts/import-neon-backup.mjs /tmp/pinova-legacy-blob-backup.json | tee /tmp/neon-import-result.json
          node -e '
          const fs=require("fs");
          const r=JSON.parse(fs.readFileSync("/tmp/neon-import-result.json","utf8"));
          if (!r.ok || r.destructiveOperations !== false) throw new Error("Neon import safety check failed");
          console.log(JSON.stringify(r,null,2));
          '

      - name: Upload backup artifact
        uses: actions/upload-artifact@v6
        with:
          name: pinova-legacy-blob-backup
          path: /tmp/pinova-legacy-blob-backup.json
          if-no-files-found: error
          retention-days: 7
