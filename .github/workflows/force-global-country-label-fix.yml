name: Force Global Country Label Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Replace Nigeria primary label
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/education/InstitutionDirectory.tsx')
          text = path.read_text()
          updated = text.replace('Primary Deployment Hub', 'Deployment Hub')
          if updated == text:
              raise SystemExit('Nigeria primary deployment label not found')
          path.write_text(updated)
          PY
      - name: Commit fix and remove helper
        run: |
          rm -f .github/workflows/force-global-country-label-fix.yml .github/workflows/fix-global-country-label.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/education/InstitutionDirectory.tsx .github/workflows/force-global-country-label-fix.yml .github/workflows/fix-global-country-label.yml
          git commit -m 'fix(education): normalize Nigeria as deployment hub only'
          git push
