name: PiNova Global Hub CI

on:
  push:
    branches:
      - main
      - "fix/auth-durable-session-revocation"
  pull_request:
    branches:
      - main
      - "design/premium-landing-preview"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript lint
        run: npm run lint

      - name: Durable authentication regression tests
        run: npm run test:auth:durable

      - name: Authentication audit regression tests
        run: npm run test:audit

      - name: Production build
        run: npm run build

      - name: Test suite
        run: npm test
