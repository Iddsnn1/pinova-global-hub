name: PiNova Preview FX and Invoice Security Tests

on:
  push:
    branches:
      - migration/neon-durable-storage
    paths:
      - "src/server/services/PiNovaFxService.ts"
      - "src/server/services/PiPaymentVerificationService.ts"
      - "src/server/services/PiOrderPaymentContract.ts"
      - "api/orders.ts"
      - "tests/pinova_fx_service_suite.ts"
      - "tests/education_payment_authorization_suite.ts"
      - "tests/pi_payment_verification_suite.ts"
      - "tests/pi_order_payment_contract_suite.ts"
      - "package.json"
      - ".github/workflows/pinova-preview-security-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: FX provider mocked tests
        run: npm run test:fx
      - name: Education invoice authorization tests
        run: npm run test:edu:security
      - name: Pi payment verification mocked tests
        run: npm run test:pi:verification
      - name: Pi order amount precision contract tests
        run: npx tsx tests/pi_order_payment_contract_suite.ts
