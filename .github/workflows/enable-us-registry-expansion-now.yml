name: Enable NCES Registry Expansion Now

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable expansion job
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/expand-us-education-registry.yml')
          s = p.read_text()
          s = s.replace("if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[expand-us-registry]')", "if: github.event_name == 'workflow_dispatch' || true", 1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/expand-us-education-registry.yml
          git commit -m "chore(education): enable NCES expansion workflow"
          git push origin main
